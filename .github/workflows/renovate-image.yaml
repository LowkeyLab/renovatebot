name: Renovate Image

on:
  pull_request:
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/renovate-image.yaml
  push:
    branches:
      - main
    paths:
      - Dockerfile
      - .dockerignore
      - .github/workflows/renovate-image.yaml
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: renovate-image-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'publish' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin

      - name: Build and publish image
        env:
          IMAGE: ghcr.io/lowkeylab/renovatebot
          PUBLISH: ${{ github.event_name != 'pull_request' }}
        run: |
          docker buildx create --use
          docker buildx build \
            --pull \
            --platform linux/amd64 \
            --cache-from type=gha \
            --cache-to type=gha,mode=max \
            --tag "$IMAGE:full" \
            --tag "$IMAGE:$GITHUB_SHA" \
            --push="$PUBLISH" \
            .
